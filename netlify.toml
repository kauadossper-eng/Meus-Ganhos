# Site estático: não precisa de build, publica a pasta como está.
[build]
  publish = "."

# Sempre buscar a versão nova destes arquivos
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
